name: validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-and-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            bash -n "$file" || exit
          done < <(
            find . -type f \( \
              -name '*.sh' \
              -o -path './scripts/uu-remote' \
              -o -path './scripts/uu-remote-bridge' \
            \) -not -path './build/*' -print
          )

      - name: Compile Python
        run: python3 -m compileall -q scripts tests

      - name: Install test compilers and isolated clipboard runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64-win32 \
            wine wine64 wine64-tools \
            x11-utils xclip xvfb libglib2.0-bin desktop-file-utils \
            x11vnc xdotool openbox tigervnc-viewer python3-gi gir1.2-gtk-3.0 python3-xlib

      - name: Run unit and documentation tests
        env:
          UURB_TEST_TIGERVNC: /usr/bin/xtigervncviewer
          UURB_REQUIRE_VIEWER_TESTS: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Compile the offline FreeRDP SSPI probe
        run: |
          x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror \
            -Wl,--no-insert-timestamp \
            -o "$RUNNER_TEMP/uu-freerdp-sspi-probe.exe" \
            tests/probes/uu_freerdp_sspi_probe.c

      - name: Exercise the one-way controller clipboard boundary
        env:
          UURB_WINE_BIN: /usr/bin/wine
          UURB_WINEBOOT_BIN: /usr/bin/wineboot
          UURB_WINESERVER_BIN: /usr/bin/wineserver
          WINEGCC: /usr/bin/winegcc
        run: ./scripts/test-controller-clipboard.sh

      - name: Validate approved manifests
        run: python3 scripts/patch-gameviewer.py manifests

      - name: Exercise host-to-Wine Unicode clipboard publication
        env:
          UURB_TEST_WINE: "1"
          UURB_WINE_BIN: /usr/bin/wine
          UURB_WINESERVER_BIN: /usr/bin/wineserver
        run: |
          python3 -m unittest discover -s tests -p test_host_clipboard_win32.py -v
          python3 -m unittest discover -s tests -p test_clipboard_guard.py -v
          python3 -m unittest discover -s tests -p test_injector_targeting.py -v
          python3 -m unittest discover -s tests -p test_input_routing.py -v
